        - id: p4-catarata-3
          titulo: Por ligação, se preferir
          texto: |
            Oi, {{nome}}! Da CEVICO. Se preferir, posso ligar para combinar a consulta com calma, ou falar com a pessoa da família que te ajuda nessas coisas.
            Me diz o que é mais fácil para você.

