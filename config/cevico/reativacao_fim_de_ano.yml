        - id: p3-catarata-3
          titulo: Pergunte o investimento antes
          texto: |
            Oi, {{nome}}! Da CEVICO. Se a dúvida for o investimento da cirurgia, pode perguntar por aqui: a gente explica o valor por olho e as formas de pagamento antes de você marcar qualquer coisa.
            Fica à vontade.

  - key: desmarcou
    prioridade: 4
    coluna: Desmarcou a Consulta
    coluna_regex: "desmarcou"
    titulo: Desmarcou a consulta
    quem: Marcou a avaliação e desmarcou (às vezes sem remarcar).
    estrategia: >-
      Retomar o que a pessoa mesma pediu, com um jeito fácil de remarcar
      (período + unidade). Acolher a insegurança, que é o motivo mais comum.
    quando: 1 semana depois de desmarcar; a da insegurança 10 dias depois.
    mensagens:
      refrativa:
        - id: p4-refrativa-1
          titulo: Fechar o ano com a resposta
          texto: |
            Oi, {{nome}}! Aqui é da CEVICO. Você desmarcou a avaliação e eu fiquei de te chamar quando ficasse melhor.
            Que tal fechar o ano com essa resposta? A avaliação de 150 reais, com os exames inclusos, mostra se a cirurgia é segura e eficaz para você.
            Tenho horários nesta e na próxima semana.
        - id: p4-refrativa-2
          titulo: Remarcar é simples
          texto: |
            Oi, {{nome}}, tudo bem? É da CEVICO. Remarcar é simples: me diz o período (manhã ou tarde) e a unidade (Paulista ou Tatuapé) que eu te passo as opções.
            E um detalhe que vale saber: quem decide ainda este ano fica com as condições de investimento de hoje.
        - id: p4-refrativa-3
          titulo: Se bateu uma insegurança
          texto: |
            Oi, {{nome}}! Da CEVICO. Se desmarcou porque bateu uma insegurança, é normal: o medo mais comum é "e se não der certo?".
            A avaliação existe justamente para isso. Só indicamos a cirurgia quando é segura e eficaz, com margem; se não for, você entende o porquê e sai sabendo as suas alternativas.
            Quer que eu te explique como ela funciona antes de remarcar?
      lentes:
        - id: p4-lentes-1
          titulo: Retomar a avaliação
          texto: |
            Oi, {{nome}}! Aqui é da CEVICO. Fiquei de retomar com você a avaliação para a lente intraocular.
            Posso te passar os horários desta e da próxima semana, na Paulista ou no Tatuapé? Os exames estão inclusos nos 150 reais.
        - id: p4-lentes-2
          titulo: Qual lente é a sua
          texto: |
            Oi, {{nome}}, tudo bem? É da CEVICO. Para grau alto ou vista cansada, a avaliação é o passo que define qual lente é a sua e se o caminho é seguro para o seu olho.
            Dá para fazer ainda este ano. Que dia é mais tranquilo para você?
        - id: p4-lentes-3
          titulo: Vale a pena para o meu grau?
          texto: |
            Oi, {{nome}}! Da CEVICO. Se a dúvida é se vale a pena para o seu grau, me conta por aqui o que você usa hoje (óculos, lente de contato, os dois) que eu te oriento antes de remarcar.
            Sem compromisso.
      catarata:
        - id: p4-catarata-1
          titulo: Um novo dia antes do fim do ano
          texto: |
            Oi, {{nome}}! Aqui é da CEVICO. Você precisou desmarcar a consulta de catarata, e eu quis voltar para ver se conseguimos um novo dia antes do fim do ano.
            Pode ser na Paulista ou no Tatuapé, no horário que for melhor para você ou para quem te acompanha.
        - id: p4-catarata-2
          titulo: Dirigir à noite, ler de novo
          texto: |
            Oi, {{nome}}, tudo bem? É da CEVICO. Quando a catarata avança, dirigir à noite e ler ficam mais difíceis. A cirurgia devolve nitidez com uma lente definitiva.
