# 📣 CAMPANHA DE REATIVAÇÃO DE FIM DE ANO (item 380, 03/11/2026)
#
# Mensagens PRONTAS de WhatsApp para reativar a base, por público (coluna do
# CRM, em ordem de prioridade 1 → 6) e por frente (refrativa a laser, lentes
# intraoculares, catarata). Este arquivo é o ORIGINAL; o que o Guilherme
# editar na tela (Marketing → Campanhas → Reativação) fica por cima, em
# agenda_config['reactivation_messages'] (por id), com "Restaurar original".
#
# Voz (nucleo-criativo/marca/cevico.md): curta, simples, "a gente", informa
# primeiro e convida depois; sem superlativo, sem promessa de resultado, sem
# "última vaga/desconto"; "investimento", nunca preço; valores só de
# provas/fatos.md e sempre com a unidade; autoridade = equipe + estrutura da
# CEVICO; "só indicamos quando é seguro e eficaz, com margem".
# Variável: {{nome}} = primeiro nome do paciente (no modelo da Meta vira {{1}}).
campanha:
  titulo: Reativação de fim de ano
  resumo: >-
    Reativar quem já falou com a CEVICO e ainda não operou: do mais quente (teve
    indicação e orçamento, não fechou) ao mais frio (chegou e sumiu). A premissa
    de todas as mensagens é verdadeira e precisa continuar verdadeira: o
    investimento será atualizado em janeiro, e quem opera ainda este ano fica com
    as condições de hoje.
  variavel: "{{nome}}"
  regras:
    - "Cada mensagem é UMA ideia: ou o fim do ano, ou a dúvida que ficou, ou a família."
    - "Valores só os confirmados: PRK 4.900 e LASIK 5.700 reais (dois olhos, até 10x sem juros); Artisan 11.900 reais por olho; avaliação 150 reais com biometria, microscopia, fundo de olho e tomografia da córnea inclusos. Catarata: sem valor na mensagem (por olho, a equipe informa)."
    - "Nunca: melhor, garantia, 100%, sem risco, cura, zerar o grau, última vaga, promoção, desconto, antes-e-depois."
    - "A mensagem sai como MODELO aprovado pela Meta (categoria Marketing): {{nome}} vira {{1}}."

frentes:
  - key: refrativa
    titulo: Refrativa a laser
    sub: PRK e LASIK — miopia, astigmatismo, hipermetropia
    cor: "#2563EB"
    icone: i-lucide-zap
  - key: lentes
    titulo: Lentes intraoculares
    sub: Artisan (grau alto) e faco refrativa / trifocal (vista cansada)
    cor: "#7C3AED"
    icone: i-lucide-circle-dot
  - key: catarata
    titulo: Catarata
    sub: Cirurgia de catarata com lente definitiva
    cor: "#0F766E"
    icone: i-lucide-sun

publicos:
  - key: nao_fechou
    prioridade: 1
    coluna: Não Fechou Ainda
    coluna_regex: "n[aã]o fechou"
    titulo: Não fechou ainda
    quem: Passou pela consulta, tem indicação e orçamento, mas não marcou a cirurgia.
    estrategia: >-
      O passo difícil já foi dado. A mensagem lembra que a avaliação está feita e
      válida, traz o fim do ano como momento natural e abre espaço para a dúvida
      que segurou a decisão. Nunca cobra; convida.
    quando: Primeira rodada em novembro; segunda 15 dias depois, com a mensagem da dúvida.
    mensagens:
      refrativa:
        - id: p1-refrativa-1
          titulo: Fechar o ano enxergando
          texto: |
            Oi, {{nome}}! Aqui é da CEVICO. Você já passou pela avaliação e a cirurgia é indicada para você — só faltou a data.
            Até dezembro ainda temos datas no centro cirúrgico, e quem opera este ano fica com as condições de investimento de hoje (em janeiro elas serão atualizadas).
            Quer que eu te passe as opções?
        - id: p1-refrativa-2
          titulo: O custo de adiar mais um ano
          texto: |
            Oi, {{nome}}, tudo bem? É da CEVICO. Todo começo de ano é a mesma cena: procurar os óculos antes de conseguir enxergar o despertador.
            A sua avaliação já está feita e válida. Se quiser, eu te explico como ficaria em até 10x sem juros, sem compromisso.
            Posso?
        - id: p1-refrativa-3
          titulo: A dúvida que ficou
          texto: |
            Oi, {{nome}}! Da CEVICO. Às vezes o que segura a decisão é uma dúvida que ninguém respondeu: o pós, o dia da cirurgia, o investimento.
            Me conta qual é a sua que eu respondo com calma. E se fizer sentido operar ainda este ano, a gente vê a melhor data juntos.
      lentes:
        - id: p1-lentes-1
          titulo: Ainda dá tempo este ano
          texto: |
            Oi, {{nome}}! Aqui é da CEVICO. Na sua avaliação ficou definido que a lente intraocular é o caminho seguro e eficaz para o seu grau.
            Ainda dá para fazer este ano: temos datas em novembro e dezembro, e o investimento de hoje vale para quem opera até o fim do ano.
            Quer ver as opções?
        - id: p1-lentes-2
          titulo: Um olho de cada vez
          texto: |
            Oi, {{nome}}, é da CEVICO. Grau alto cansa: a lente grossa, o óculos pesado, a lente de contato que seca no fim do dia.
            A sua indicação foi pensada para isso, e a decisão pode ser em etapas, um olho de cada vez.
            Quer que eu te explique o investimento por olho e as datas?
        - id: p1-lentes-3
          titulo: Não deixar parado
          texto: |
            Oi, {{nome}}! Da CEVICO. Fiquei de te acompanhar depois da avaliação e não quero que a sua decisão fique parada por falta de resposta.
            Qual foi a dúvida que ficou: a lente, a recuperação, o investimento? Me conta por aqui que eu explico, e se quiser fechamos o ano com isso resolvido.
      catarata:
        - id: p1-catarata-1
          titulo: Antes das festas
          texto: |
            Oi, {{nome}}! Aqui é da CEVICO. A sua cirurgia de catarata já está indicada e a equipe só aguarda a sua data.
            Ainda temos horários no centro cirúrgico antes das festas, e quem opera este ano fica com as condições de investimento de hoje.
            Posso te passar as datas por aqui?
        - id: p1-catarata-2
          titulo: A catarata não espera o ano virar
          texto: |
            Oi, {{nome}}, tudo bem? É da CEVICO. A catarata vai embaçando a visão aos poucos, e dirigir à noite ou ler fica cada vez mais difícil.
            A cirurgia é feita pela nossa equipe de cirurgiões de catarata, com mais de 30.000 cirurgias cada um, com lentes importadas Rayner.
            Quer que eu explique como fica o investimento por olho?
        - id: p1-catarata-3
          titulo: Decidir com a família
          texto: |
            Oi, {{nome}}! Da CEVICO. Se a decisão passa pela família, podemos conversar com quem vai te acompanhar (filho, filha, esposo ou esposa) e tirar todas as dúvidas juntos, por aqui ou por ligação.
            Me diz o melhor horário que a gente combina.

  - key: indicacao
    prioridade: 2
    coluna: Indicação de Cirurgia
    coluna_regex: "indica[çc][aã]o de cirurgia"
    titulo: Indicação de cirurgia
    quem: Fez a consulta e o médico indicou a cirurgia; ainda não falou de data.
    estrategia: >-
      Reforçar o que o médico já confirmou (é seguro e eficaz, com margem) e
      transformar a indicação em próximo passo: investimento e data. Responder a
      pergunta que mais aparece depois da consulta, a recuperação.
    quando: Até 7 dias depois da consulta; se não responder, a mensagem da recuperação 10 dias depois.
    mensagens:
      refrativa:
        - id: p2-refrativa-1
          titulo: O passo mais difícil já foi dado
          texto: |
            Oi, {{nome}}! Aqui é da CEVICO. Na sua consulta o médico confirmou: a cirurgia é segura e eficaz para o seu caso, com margem de segurança.
            Esse é o passo mais difícil, e ele já está dado. Quer que eu te mostre como ficaria o investimento e as datas ainda este ano?
        - id: p2-refrativa-2
          titulo: A agenda de dezembro
          texto: |
            Oi, {{nome}}, tudo bem? É da CEVICO. Seus exames continuam válidos e a indicação está registrada.
            Entre novembro e dezembro a agenda cirúrgica costuma fechar rápido, então quis te avisar antes: quem opera este ano fica com as condições de investimento de hoje.
            Te passo as opções?
        - id: p2-refrativa-3
          titulo: E a recuperação?
          texto: |
            Oi, {{nome}}! Da CEVICO. A pergunta que mais ouvimos depois da consulta: "e a recuperação?"
            No LASIK, em geral 24 a 48 horas. No PRK, de 3 a 7 dias para voltar ao trabalho. Dá para encaixar antes das férias.
            Quer que eu veja uma data com você?
      lentes:
        - id: p2-lentes-1
          titulo: Existe um caminho para o seu grau
          texto: |
            Oi, {{nome}}! Aqui é da CEVICO. O médico indicou a lente intraocular para o seu grau, e isso quer dizer que existe um caminho seguro e eficaz para você depender menos dos óculos.
            Posso te explicar como funciona o investimento por olho e as datas deste ano?
        - id: p2-lentes-2
          titulo: Primeiro olho ainda este ano
          texto: |
            Oi, {{nome}}, é da CEVICO. A lente intraocular é feita um olho de cada vez, com retorno no dia seguinte.
            Muita gente opera o primeiro olho ainda este ano e o segundo logo depois. Quer que eu te mostre como fica a sequência e o investimento?
        - id: p2-lentes-3
          titulo: A dúvida sobre a lente
          texto: |
            Oi, {{nome}}! Da CEVICO. Depois da consulta é normal ficar uma dúvida sobre a lente: se é definitiva, como é a adaptação, como é o dia da cirurgia.
            Me conta a sua que eu respondo com calma. E se fizer sentido, vemos uma data ainda em 2026.
      catarata:
        - id: p2-catarata-1
          titulo: Lente definitiva, equipe experiente
          texto: |
            Oi, {{nome}}! Aqui é da CEVICO. Na sua consulta ficou indicada a cirurgia de catarata. A lente que entra no lugar da catarata é definitiva, e a nossa equipe usa lentes importadas Rayner.
            Posso te explicar como fica o investimento por olho e as datas ainda este ano?
        - id: p2-catarata-2
          titulo: Recuperação tranquila
          texto: |
            Oi, {{nome}}, tudo bem? É da CEVICO. A recuperação da cirurgia de catarata costuma ser tranquila: no dia seguinte você já vem para o retorno, sem custo.
            Se quiser operar antes das festas, ainda temos datas. Quer que eu veja com você?
        - id: p2-catarata-3
          titulo: Chame a família para a conversa
          texto: |
            Oi, {{nome}}! Da CEVICO. Se alguém da família for te acompanhar na decisão, me passa o contato ou chama a pessoa aqui na conversa: a gente explica tudo de novo, sem pressa.
            Combinado?

  - key: nao_foi
    prioridade: 3
    coluna: Não Foi a Consulta
    coluna_regex: "n[aã]o foi"
    titulo: Não foi à consulta
    quem: Marcou a avaliação e não apareceu.
    estrategia: >-
      Zero cobrança. Remarcar é simples, os exames continuam inclusos, as duas
      unidades estão à disposição. A terceira mensagem abre a dúvida que fez a
      pessoa não ir.
    quando: 2 a 3 dias depois da falta; a da dúvida 1 semana depois.
    mensagens:
      refrativa:
        - id: p3-refrativa-1
          titulo: A vida corre, a gente remarca
          texto: |
            Oi, {{nome}}! Aqui é da CEVICO. Vi que a sua avaliação não aconteceu. Acontece, a vida corre.
            Os exames (biometria, microscopia, fundo de olho e tomografia da córnea) continuam inclusos nos 150 reais.
            Quer escolher um novo dia? Tenho horários na Paulista e no Tatuapé.
        - id: p3-refrativa-2
          titulo: Manhã ou tarde?
          texto: |
            Oi, {{nome}}, tudo bem? É da CEVICO. Sem cobrança nenhuma: se o dia não deu certo, a gente remarca.
            A avaliação é o que mostra se a cirurgia é segura e eficaz para você, e quem decide ainda este ano fica com as condições de investimento de hoje.
            Que período fica melhor: manhã ou tarde?
        - id: p3-refrativa-3
          titulo: A dúvida que impediu
