            Me conta qual é a sua que eu te respondo por aqui. Depois, se quiser, a gente vê um dia que caiba na sua rotina.
      lentes:
        - id: p3-lentes-1
          titulo: O seu caso continua tendo caminho
          texto: |
            Oi, {{nome}}! Aqui é da CEVICO. A sua avaliação ficou para trás, mas o seu caso continua tendo caminho: para grau alto ou vista cansada, a lente intraocular pode ser a solução segura.
            Quer remarcar? Tenho horários na Paulista e no Tatuapé, com os exames inclusos nos 150 reais.
        - id: p3-lentes-2
          titulo: "Não sabia que era possível"
          texto: |
            Oi, {{nome}}, tudo bem? É da CEVICO. Quando o grau é alto, muita gente desiste antes de saber se pode, e depois nos conta: "não sabia que era possível".
            É a avaliação que responde isso. Posso te passar as datas desta semana?
        - id: p3-lentes-3
          titulo: Um dia que caiba na rotina
