  - key: novos
    prioridade: 6
    coluna: Novos Contatos
    coluna_regex: "novos contatos"
    titulo: Novos contatos
    quem: Chegou pelo WhatsApp, trocou poucas mensagens e sumiu.
    estrategia: >-
      Começar do zero com leveza: a pergunta "será que eu posso?", a cena do
      fim de ano, a autoridade da equipe. Sem orçamento na mensagem (o processo
      de vendas entrega o investimento na conversa).
    quando: Para quem chegou há mais de 3 dias e não respondeu; só 1 mensagem por quinzena.
    mensagens:
      refrativa:
        - id: p6-refrativa-1
          titulo: Será que eu posso?
          texto: |
