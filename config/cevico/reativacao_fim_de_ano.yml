        - id: p3-catarata-1
          titulo: Está tudo bem?
          texto: |
            Oi, {{nome}}! Aqui é da CEVICO. A sua consulta de catarata não aconteceu e queria saber se está tudo bem.
            Podemos remarcar para um horário mais fácil, na Paulista ou no Tatuapé. Se alguém for te acompanhar, é só avisar que a gente organiza.
            Qual dia fica melhor?
        - id: p3-catarata-2
          titulo: O embaçado vira "normal"
          texto: |
            Oi, {{nome}}, tudo bem? É da CEVICO. A catarata piora devagar, e a visão embaçada vai virando "normal" sem a gente perceber.
