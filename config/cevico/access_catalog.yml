# 🔐 CATÁLOGO DE ACESSOS (rodada 334, 12/10) — a ÚNICA lista do que existe
# no sistema, em árvore pai/filho. Alimenta o servidor (trava de verdade),
# as rotas, o menu lateral e a tela Acessos.
#
# Cada nó:
#   key       chave curta; a chave completa é o caminho com ponto (crm.funis)
#   label     nome que o admin lê; {{paciente}} e afins seguem o vocabulário
#             da empresa (Identidade da empresa)
#   hint      o que abre / o que "editar" significa ali
#   levels    [view] = só dá para VER; [view, edit] = ver OU editar
#   default   o que um atendente SEM configuração tem: none | view | edit |
#             inherit (segue o pai)
#   admin     true = só administrador (não dá para conceder)
#   explicit  true = NÃO herda do pai: só vale com marcação própria no nó
#             (portas perigosas, que "CRM = editar" não deve abrir por tabela)
#   segment   clinica = só aparece em empresa do ramo clínica
#   children  os filhos
#
# Regra de herança: o que o admin marca num nó vale para os filhos, a não
# ser que o filho tenha marcação própria — ou seja um nó `explicit`.
# Editar sempre inclui ver.
- key: inicio
  label: Meu Painel
  hint: a tela de abertura, com os indicadores e avisos de cada pessoa
  levels: [view]
  default: view

- key: conversas
  label: Conversas
  hint: "ver = lê as conversas das caixas em que está; editar = responde {{paciente_plural}}"
  levels: [view, edit]
  default: edit

- key: chamadas
  label: Chamadas (ligações pelo WhatsApp)
  hint: "ver = acompanha as ligações; editar = atende, liga e devolve ligação"
  levels: [view, edit]
  default: edit

- key: crm
  label: CRM (funil de atendimento)
  hint: "ver = enxerga o quadro; editar = cria {{paciente}}, move cartões e etiqueta"
  levels: [view, edit]
  default: edit
  children:
    - key: funis
      label: Funis e colunas (estrutura)
      hint: "criar, renomear, reordenar e apagar funis e colunas (não herda de CRM: marque aqui de propósito)"
      levels: [edit]
      default: none
      # auditoria 12/10 (#19/#245/#299): apagar um funil leva colunas, cards e
      # histórico junto — "CRM = editar" (próprio, do papel ou do modelo antigo)
      # NÃO abre esta porta; só marcação própria neste nó
      explicit: true
    - key: campanhas
      label: Campanha WhatsApp
      hint: "ver = painel e histórico (o time todo, por padrão); editar = cria e dispara campanhas e ligações em massa"
      levels: [view, edit]
      default: view
    - key: jornada
      label: Jornada do {{paciente}}
      hint: "ver = o mapa e a fila do dia (o time todo, por padrão); editar = mensagens da jornada, aprovar envios"
      levels: [view, edit]
      default: view
    - key: formularios
      label: Formulários
      hint: "ver = respostas; editar = cria e altera formulários"
      levels: [view, edit]
      default: none
    - key: agendamentos
      label: Agendamentos (monitor do time)
      hint: a lista do que foi marcado, remarcado e confirmado
      levels: [view]
      default: view
    - key: fontes
      label: Ambientes do CRM (fontes de {{paciente_plural}})
      hint: qual número e qual funil ficam em qual ambiente; carimbo de origem
      levels: [view, edit]
      admin: true

- key: agenda
  label: Agenda
  hint: "ver = consulta a agenda; editar = marca, remarca, confirma e cancela"
  levels: [view, edit]
  default: edit
  children:
    - key: notificacoes
      label: Notificações sobre agendamentos
      hint: "ver = os alertas de cadastro e consulta para conferir (atendente vê os seus); editar = juntar, separar, mover consulta"
      levels: [view, edit]
      default: inherit
    - key: exames
      label: Agenda de exames
      hint: a janela própria dos exames
      levels: [view, edit]
      default: inherit
    - key: cirurgias
      label: Agenda cirúrgica
      hint: a agenda independente das cirurgias
      levels: [view, edit]
      default: inherit
      segment: clinica
    - key: bloqueios
      label: Fechar e reabrir dias
      hint: bloquear um dia, uma unidade ou um profissional
      levels: [edit]
      default: edit
    - key: lixeira
      label: Lixeira da Agenda
      hint: restaurar ou apagar de vez o que foi excluído
      levels: [view, edit]
      default: none
    - key: imprimir
      label: Imprimir folha do dia
      hint: a folha de atendimento impressa
      levels: [view]
      default: view
    - key: configuracao
      label: Horários e regras da Agenda
      hint: janelas de atendimento, valores, modelos de confirmação
      levels: [edit]
      default: none

- key: pacientes
  label: "{{Paciente_plural}} (Espaço do {{paciente}})"
