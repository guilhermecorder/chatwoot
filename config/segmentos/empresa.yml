# ═══════════════════════════════════════════════════════════════════
# SEGMENTO: EMPRESA (o coringa genérico) — serve para qualquer mercado.
#
# Ativado com `segmento: empresa` no yml da marca (ou SEGMENTO=empresa
# no ambiente da VPS). Tudo aqui é EDITÁVEL: troque termos, profissionais,
# unidades, preços e prompts pela realidade do negócio — ou copie este
# arquivo para config/segmentos/<novo>.yml e crie um segmento próprio
# (ex.: solar.yml, imobiliaria.yml) sem tocar em código.
#
# REGRA DAS KEYS: os valores de `key` (unidades, modalidades, categorias)
# são gravados no banco junto com os dados — renomear label é livre,
# renomear key com dados já gravados quebra o histórico.
# ═══════════════════════════════════════════════════════════════════
