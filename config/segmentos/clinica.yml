  - { group: 'Refrativa (2 olhos)', name: 'PRK',              price: 4900 }
  - { group: 'Refrativa (2 olhos)', name: 'Lasik',            price: 5700 }
  - { group: 'Catarata (por olho)', name: 'Nacional',         price: 2800 }
  - { group: 'Catarata (por olho)', name: 'Mono Rayner',      price: 3200 }
  - { group: 'Catarata (por olho)', name: 'Tórica monofocal', price: 5600 }
  - { group: 'Catarata (por olho)', name: 'Foco estendido',   price: 5690 }
  - { group: 'Catarata (por olho)', name: 'Trifocal',         price: 8490 }
  - { group: 'Catarata (por olho)', name: 'Galaxy',           price: 14990 }
  - { group: 'Fácica',              name: 'Artisan',          price: 11900 }

# Metas de referência dos painéis.
metas:
  vendas_mes: 100

# Nome de quem cuida de cada painel do Início (vazio = sem nome exibido).
paineis:
  agendamento: 'Vaneide'
  conducao: 'Elizangela'
  fechamento: 'Gabriela'

# Jornada padrão do Painel Estratégico (nasce pronta na primeira visita).
jornada:
  id: 'jornada-padrao'
  nome: 'Jornada do paciente (padrão)'
  emoji: '🏥'
  etapas:
    - { id: p1, titulo: 'Agendamento', desc: 'Lead atendido no WhatsApp e consulta marcada na Agenda.', handoff: 'Confirmação enviada; card vai para "Consulta Confirmada".' }
    - { id: p2, titulo: 'Comparecimento', desc: 'Recepção confirma a chegada; conferência do dia marca Compareceu/Faltou.', handoff: 'Quem faltou entra na régua de reagendamento.' }
    - { id: p3, titulo: 'Consulta', desc: 'Avaliação com o médico; anotações clínicas no Espaço do Paciente.', handoff: 'Médico registra a conduta: indicação de cirurgia ou não.' }
    - { id: p4, titulo: 'Indicação de cirurgia (ou não)', desc: 'Com indicação: orçamento oficial pela tabela de preços. Sem indicação: orientação e retorno.', handoff: 'Card vai para "Indicação de Cirurgia" e o fechamento assume.' }
    - { id: p5, titulo: 'Fechamento (ou não)', desc: 'Negociação com o mapa de objeções e o script validado; agendar a cirurgia.', handoff: 'Fechou: Agenda de Cirurgias. Não fechou: régua "Não Fechou Ainda".' }

# Pilares padrão do Painel Estratégico.
pilares:
  - { nome: 'Aquisição de Pacientes', subtitulo: 'Marketing e vendas — do anúncio ao agendamento', emoji: '🧲', cor: navy, posicao: 0 }
  - { nome: 'Operação Clínica', subtitulo: 'Exames, consultas (avaliação e pós-operatório) e procedimentos cirúrgicos', emoji: '🏥', cor: emerald, posicao: 1 }
  - { nome: 'Financeiro & Tributário', subtitulo: 'Caixa, custos, impostos e margem', emoji: '💰', cor: gold, posicao: 2 }

