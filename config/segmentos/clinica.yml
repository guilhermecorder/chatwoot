# ═══════════════════════════════════════════════════════════════════
# SEGMENTO: CLÍNICA OFTALMOLÓGICA — a pré-seleção de fábrica.
#
# Este pacote guarda EXATAMENTE os valores que sempre estiveram
# chumbados no código (médicos, unidades, janelas, termos, preços).
# Sem SEGMENTO no ambiente e sem `segmento:` na marca, é ele que vale —
# ou seja, a CEVICO continua idêntica ao que sempre foi.
#
# Os prompts dos robôs NÃO ficam aqui de propósito: os SYSTEM_PROMPT
# chumbados nos serviços SÃO o preset da clínica (fonte única, sem
# risco de divergência). Outros segmentos sobrescrevem em `prompts:`.
# ═══════════════════════════════════════════════════════════════════
id: clinica
nome: 'Clínica oftalmológica'

# Como este mercado chama cada papel/evento do sistema.
# As CHAVES são os conceitos genéricos; os VALORES, a voz do segmento.
termos:
  cliente: paciente
  clientes: pacientes
  profissional: médico
  profissionais: médicos
  atendimento: consulta
  atendimentos: consultas
  venda: cirurgia
  vendas: cirurgias
  empresa: clínica
  unidade: unidade
  unidades: unidades

# Rótulos compostos (onde gênero/concordância mudam entre segmentos).
frases:
  novo_atendimento: 'Nova consulta'
  agendar_venda: 'Agendar cirurgia'
  agenda_atendimentos: 'Agenda de Consultas'
  agenda_vendas: 'Agenda de Cirurgias'
  espaco_cliente: 'Espaço do Paciente'
  espaco_profissional: 'Espaço do Médico'
  janelas_profissionais: 'Janelas dos médicos'
  janelas_avaliacao: 'Janelas de avaliação dos médicos'
  sem_agenda_avaliacao: 'Sem agenda de avaliação'
  dashboard_profissionais: 'Dashboard dos Médicos'
  atendimento_atualizado: 'Consulta atualizada'
  atendimento_removido: 'Consulta removida'
  venda_marcada: 'Cirurgia agendada 🔪'
  erro_salvar_atendimento: 'Erro ao salvar a consulta.'
  erro_remover_atendimento: 'Erro ao remover a consulta.'
  indicacao_venda: 'Indicação de cirurgia'
  vendas_realizadas: 'Cirurgias realizadas'
  vendas_agendadas: 'Cirurgias agendadas'
  atendimentos_periodo: 'Consultas no período'
  atendimentos_agendados: 'Consultas agendadas'
  conversao_venda: 'Conversão em cirurgia'
  fechamento_vendas: 'Fechamento de cirurgias'
  indicacoes_venda: 'Indicações de cirurgia'
  trilho_vendas: 'Trilho de cirurgias'
  sala_execucao: 'Sala cirúrgica'
  tipo_atendimento: 'Tipo de consulta'
  conferencia_atendimentos: 'Consultas'
  conferencia_vendas: 'Cirurgias'
  atendimento_agendado_ia: 'Consulta agendada pela IA'
  atendimento_reagendado_ia: 'Consulta REAGENDADA pela IA'
  confirmar_atendimento: 'Confirmar consulta'

# Os "médicos" do segmento: nome oficial + apelido curto + cor +
# grafias toleradas (o campo doctor das tasks é texto livre).
profissionais:
  - nome: 'Dr. Gustavo Bittar'
    apelido: 'Gustavo'
    cor: '#0F5FA6'
    grafias: 'gustavo|bittar'
  - nome: 'Dr. Henrique Gemelli'
    apelido: 'Henrique'
    cor: '#B8860B'
    grafias: 'henrique|gemelli'
  - nome: 'Dra. Roberta Negri'
    apelido: 'Roberta'
    cor: '#7C3AED'
    grafias: 'roberta|negri'

# Unidades (agendas paralelas). key é o valor gravado nas tasks —
# NUNCA renomeie a key de uma unidade com dados já gravados.
unidades:
  - key: tatuape
    nome: 'Tatuapé'
    cor: '#2563EB'
    endereco: 'R. Serra de Botucatu, 880 – 4º andar, próximo à estação Carrão'
  - key: paulista
    nome: 'Av. Paulista'
    cor: '#EA580C'
    endereco: 'Av. Paulista, 1499 – 9º andar (acesso: Alameda Casa Branca, 35), próximo à estação Trianon-MASP'

# Janelas padrão de agenda — valem enquanto o admin não editar as dele
# em Agenda → "Janelas dos médicos" (crm_settings.agenda_config.windows).
# dow: 0=Dom … 6=Sáb; end é exclusivo (último bloco = end - block).
janelas_padrao:
  - { dow: 1, unit: paulista, doctor: 'Dr. Gustavo Bittar',   turno: 'Manhã', start: '08:30', end: '10:00', block: 15 }
  - { dow: 2, unit: paulista, doctor: 'Dr. Henrique Gemelli', turno: 'Manhã', start: '08:00', end: '11:30', block: 15 }
  - { dow: 2, unit: paulista, doctor: 'Dra. Roberta Negri',   turno: 'Tarde', start: '14:30', end: '16:30', block: 15 }
  - { dow: 3, unit: paulista, doctor: 'Dr. Henrique Gemelli', turno: 'Tarde', start: '13:00', end: '17:00', block: 15 }
  - { dow: 3, unit: tatuape,  doctor: 'Dr. Gustavo Bittar',   turno: 'Manhã', start: '08:30', end: '11:00', block: 10 }
  - { dow: 4, unit: paulista, doctor: 'Dr. Gustavo Bittar',   turno: 'Manhã', start: '08:30', end: '11:00', block: 15 }
  - { dow: 5, unit: tatuape,  doctor: 'Dra. Roberta Negri',   turno: 'Manhã', start: '10:30', end: '13:00', block: 10 }

# Modalidades de atendimento. As KEYS são gravadas nas tasks (modality) —
# mude os labels à vontade, nunca as keys.
modalidades:
  - { key: avaliacao, label: 'Avaliação', cor: '#0F5FA6' }
  - { key: retorno,   label: 'Retorno',   cor: '#D4A017' }
  - { key: exames,    label: 'Exames',    cor: '#7C3AED' }

# Motivo/problema do atendimento (seletor da Agenda).
problemas:
  - 'Catarata'
  - 'Refrativa'
  - 'Ceratocone'
  - 'Lentes Fácicas'
  - 'Exames'
  - 'Consulta geral'
  - 'Pós-operatório'
  - 'Plástica ocular'

# O que pode ser indicado/vendido na conferência do dia.
procedimentos:
  - 'Catarata'
  - 'Refrativa PRK'
  - 'Refrativa Lasik'
  - 'Lente Fácica'
  - 'Lente de Foco Estendido'
  - 'Trifocal'
  - 'Anel de Ferrara'
  - 'Pterígio'
  - 'Capsulotomia YAG'
  - 'Outro'

# Tabela de preços padrão (Configurações → Tabela de preços sobrepõe).
