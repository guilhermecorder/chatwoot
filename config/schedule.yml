# https://github.com/ondrejbartas/sidekiq-cron
# use https://crontab.guru/ to validate
# validations for this file exist in /spec/configs/schedule_spec.rb

# executed daily at 0000 UTC
# schedules daily deferred jobs at stable times for each installation
internal_check_new_versions_job:
  cron: '0 0 * * *'
  class: 'Internal::TriggerDailyScheduledItemsJob'
  queue: scheduled_jobs
# # executed At every 5th minute..
trigger_scheduled_items_job:
  cron: '*/5 * * * *'
  class: 'TriggerScheduledItemsJob'
  queue: scheduled_jobs

# CEVICO: campanhas agendadas + réguas de mensagens do CRM
crm_scheduler_job:
  cron: '*/5 * * * *'
  class: 'Crm::SchedulerJob'
  queue: scheduled_jobs

# CEVICO: robôs de follow-up (cutucadas para reabrir a conversa)
# roda a cada 2 min para cadências em minutos serem pontuais
# fila HIGH: sidekiq processa filas em ordem estrita e scheduled_jobs fica
# quase no fim — os jobs de IA atrasavam a cutucada de 15min em até 30min
crm_followup_bot_job:
  cron: '*/2 * * * *'
  class: 'Crm::FollowupBotJob'
  queue: high

# CEVICO: prazo da conferência do dia (tarefa automática p/ a responsável)
crm_attendance_reminder_job:
  cron: '*/30 * * * *'
  class: 'Crm::AttendanceReminderJob'
  queue: scheduled_jobs

# CEVICO: Radar de Oportunidades (cards quentes sem atendimento → aviso no Meu Painel)
crm_opportunity_radar_job:
  cron: '*/10 * * * *'
  class: 'Crm::OpportunityRadarJob'
  queue: scheduled_jobs

# CEVICO: Mentor do Time (feedback semanal por usuário no Meu Painel)
# segunda 11:00 UTC = 08:00 em São Paulo, analisando a semana que acabou
crm_weekly_mentor_job:
  cron: '0 11 * * 1'
  class: 'Crm::WeeklyMentorJob'
  queue: scheduled_jobs

# CEVICO: ciclo MENSAL do Mentor (dia 1, 08:30 SP — visão de evolução do mês)
crm_monthly_mentor_job:
  cron: '30 11 1 * *'
  class: 'Crm::MonthlyMentorJob'
  queue: scheduled_jobs

# CEVICO: Respondedor de Comentários IG/FB (só age com agente ligado + token)
crm_comments_agent_job:
  cron: '*/5 * * * *'
  class: 'Crm::CommentsAgentJob'
  queue: scheduled_jobs

# executed hourly for scheduled jobs that do not need minute-level cadence
trigger_hourly_scheduled_items_job:
  cron: '0 * * * *'
  class: 'Internal::TriggerHourlyScheduledItemsJob'
  queue: scheduled_jobs

# executed At every minute..
trigger_imap_email_inboxes_job:
  cron: '*/1 * * * *'
  class: 'Inboxes::FetchImapEmailInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_contact_inboxes_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleContactInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_redis_keys_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleRedisKeysJob'
  queue: scheduled_jobs

# DISABLED: investigating if this job is the source of orphan conversations
# #executed daily at 0430 UTC
# # which will be IST 10:00 AM
# process_stale_contacts_job:
#   cron: '30 04 * * *'
#   class: 'Internal::ProcessStaleContactsJob'
#   queue: housekeeping

# executed daily at 0100 UTC
# to delete accounts marked for deletion
delete_accounts_job:
  cron: '0 1 * * *'
  class: 'Internal::DeleteAccountsJob'
  queue: scheduled_jobs

# executed every 30 minutes for assignment_v2
periodic_assignment_job:
  cron: '*/30 * * * *'
  class: 'AutoAssignment::PeriodicAssignmentJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# removes old notifications (>1 month) and trims to 300 per user
remove_old_notification_job:
  cron: '30 22 * * *'
  class: 'Notification::RemoveOldNotificationJob'
  queue: purgable

# executed every 12 hours
# to remove orphan conversations without contact
remove_orphan_conversations_job:
  cron: '0 */12 * * *'
  class: 'Internal::RemoveOrphanConversationsJob'
  queue: housekeeping


# executado a cada 30 minutos para verificar leads parados nas colunas do CRM
crm_stalled_cards_job:
  cron: '*/30 * * * *'
  class: 'CrmStalledCardsJob'
  queue: scheduled_jobs

# 🌾 Colheitadeira da Base (item 128): de hora em hora no expediente
# (12-20 UTC = 9h-17h SP) — gera a prévia mensal no dia configurado e
# envia os lotes aprovados respeitando o teto diário
crm_harvest_job:
  cron: '10 12-20 * * 1-6'
  class: 'Crm::HarvestJob'
  queue: low

# 📊 Gestor Autônomo (item 128): dias úteis 11:10 UTC (08:10 SP) — lê o
# funil vs média de 12 semanas, abre tarefas e escreve o briefing do dia
crm_auto_manager_job:
  cron: '10 11 * * 1-5'
  class: 'Crm::AutoManagerJob'
  queue: low

# 🎓 Auditor de Conversas (item 130): diário 10:40 UTC (07:40 SP) — nota
# 0-10 nas conversas de ontem contra o script, agregado por atendente
crm_conversation_auditor_job:
  cron: '40 10 * * *'
  class: 'Crm::ConversationAuditorJob'
  queue: low

# 🎨 Criativo Perpétuo (item 131): segunda 11:30 UTC (08:30 SP) — variações
# dos vencedores da semana (termos/anúncios que viraram cirurgia) p/ aprovar
crm_creative_job:
  cron: '30 11 * * 1'
  class: 'Crm::CreativeJob'
  queue: low
